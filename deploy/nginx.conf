server {
    listen 80;
    server_name _;

    # Carpeta con el build de "npm run build" (contenido de dist/)
    root /var/www/jve-frontend;
    index index.html;

    # SPA (React Router): cualquier ruta que no sea un archivo real cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca debe quedar cacheado: si no, tras cada deploy el navegador
    # sigue usando referencias viejas a los JS/CSS con hash y rompe.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Assets versionados por Vite (nombre con hash) -> cache largo y agresivo
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # NOTA: este nginx (en vm-frontend) solo sirve archivos estaticos. El
    # reverse proxy hacia /api/ -> vm-backend (10.10.10.12:8080) lo hace el
    # nginx de vm-proxy (ver guia de infraestructura, Fase 9.1), no este.
}
