server {
    listen 80;
    server_name 192.168.10.183;

    # Carpeta con el build de "npm run build" (contenido de dist/)
    root /var/www/jve-frontend;
    index index.html;

    # SPA (React Router): cualquier ruta que no sea un archivo real cae en index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html nunca debe quedar cacheado: si no, tras cada deploy el navegador
    # sigue usando referencias viejas a los JS/CSS con hash y rompe.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Assets versionados por Vite (nombre con hash) -> cache largo y agresivo
    location ~* \.(?:js|css|woff2?|ttf|eot|png|jpg|jpeg|gif|svg|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/javascript;

    # Reverse proxy hacia el backend Spring Boot (mismo origen -> sin CORS)
    location /api/ {
        proxy_pass http://127.0.0.1:8080/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Debe ser >= spring.servlet.multipart.max-request-size (30MB) del
        # backend, si no nginx corta la subida con un 413 HTML generico
        # antes de que el request llegue al backend, sin el JSON de negocio.
        client_max_body_size 30M;
    }
}
